name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Manual "Run workflow" button, e.g. when a push event got lost during a GitHub incident
  workflow_dispatch:

# A newer push supersedes a running build, so an older commit can never overwrite :latest
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only publish images that passed the full test suite
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The build needs no git access; keeps the token out of .git/config and thus the build context
          persist-credentials: false

      # arm64 and arm/v7 so the image also runs on a Raspberry Pi (64- or 32-bit OS) next to the MQTT broker
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest = newest main; vX.Y.Z tags give pinnable versions; sha-* traces an image to its commit
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
